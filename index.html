<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8">
    <title>گالری دیجیتال | پونه لازار</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#222222">
    <meta name="description" content="گالری آثار هنری پونه لازار">
    <meta name="author" content="Amir Parsa">
    <link rel="shortcut icon" href="images/icon1.png" type="image/x-icon">
    <meta property="og:title" content="گالری آثار هنری پونه لازار">
    <meta property="og:description" content="جهت مشاهده آثار روی لینک کلیک کنید">
    <meta property="og:image" content="https://art-p-lazar.github.io/igallery/images/signboard.webp">
    <meta property="og:url" content="https://https://art-p-lazar.github.io/igallery">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="top-header">
      <div class="hero-logo">
        <img src="images/signboard.webp" alt="تابلو">
      </div> 
      <div class="hamburger" id="hamburgerBtn">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>
    
    <section id="homeView" class="view active">
      
      <section class="hero">
        <div class="hero-inner">
          <div class="hero-txt">
            <h1 class="hero-title">گالری دیجیتال پونه لازار</h1>
            <p class="hero-desc">،جهت مطالعه شناسنامه اثر <br> ...کد آن را جست و جو نمایید</p>
          </div>
          
          <div class="hero-search">
            <button id="searchBtn">جستجو</button>
            <input id="searchInput" type="number" placeholder="کد اثر را وارد کنید">
          </div>
          
          <div class="hero-actions">
            <button class="hero-scroll-btn" id="scrollToProducts">لیست آثار</button>
            <button class="hero-pooster-btn" ><a href="https://art-p-lazar.github.io/Gallery" target="_blank">پوسترها</a></button>
            <button class="hero-footer-btn" id="scrollToFooter">آدرس گالری</button>
          </div>
          
        </div>
      </section>
      
      <section id="productsSection" class="products-section">
        <div class="products-title">لیست آثار</div>
        
        <div id="productsGrid" class="products-grid"></div>
        
        <button id="showMoreBtn" class="show-more-btn">نمایش بیشتر ▼</button>
      </section>
      
    </section>
    
    <section id="productView" class="view product-view">
      <button class="back-btn" onclick="location.hash=''">بازگشت</button>
      
      <div class="product-layout">
        <img id="productImage" src="">
        <div>
          <h1 id="productTitle"></h1>
          <div id="productPrice"></div>
          <p id="productDescription"></p>
          <p id="productCode"></p>
        </div>
      </div>
    </section>
    
    <footer id="footer" class="footer">
      <div class="footer-logo">
        <img src="images/signboard.webp" alt="لوگو">
      </div>
      
      <p>آدرس: اصفهان، خیابان چهارباغ عباسی، پاساژ عالی قاپو</p>
      <p>تلفن: ۰۹۱۳۳۳۳۳۳۳۳</p>
      <p>ایمیل: art@gmail.com</p>
      
      <div class="socials">
        <a href="#"><img src="" alt=""></a>
        <a href="#"><img src="" alt=""></a>
        <a href="#"><img src="" alt=""></a>
      </div>
    </footer>
    
    <script src="js/app.js"></script>
    
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker Registered', reg))
        .catch(err => console.log('SW registration failed', err));
      }
    </script>
  </body>
</html>
